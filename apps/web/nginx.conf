# Reverse-proxy /api to the backend so the browser stays same-origin.
upstream zabify_api {
  server api:8788;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://zabify_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_http_version 1.1;
  }

  # Hashed build output: safe to cache immutably. Vite only emits
  # content-hashed filenames under /assets/.
  location ^~ /assets/ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }

  # Never cache the app shell, the service worker, or the manifest.
  # index.html references hashed assets that are PURGED on every deploy;
  # a cached copy would boot a broken, unstyled app until a hard refresh.
  location = /index.html {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }
  location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }
  location = /registerSW.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }
  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }
  location = /favicon.svg {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # SPA fallback. This serves index.html CONTENT for client routes, so it
  # must also be revalidated every time — never max-age cached.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
